<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차카데미 - 노크세르 기숙사 정보 공유소</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase App & Database Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    /* 노크세르 기숙사 노란계열 테마 CSS */
    :root {
      --bg-color: #1a1813;           /* 살짝 노란빛이 도는 딥 다크 배경 */
      --card-bg: #26231b;            /* 카드는 은은한 웜 브라운/옐로우 톤 */
      --card-border: #3d3728;        /* 테두리 톤 */
      --primary-yellow: #f1c40f;     /* 노크세르 메인 옐로우 */
      --accent-gold: #e67e22;        /* 골드/오렌지 포인트 */
      --text-main: #f5f0e6;          /* 따뜻한 아이보리 텍스트 */
      --text-sub: #b8af9c;           /* 서브 텍스트 */
      --input-bg: #14120e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #2c271d 0%, #1a1813 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(241, 196, 15, 0.08);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-yellow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 카드 세션 스타일 */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.4rem;
      color: var(--primary-yellow);
      margin-bottom: 18px;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 정보 등록 폼 */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-yellow);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-yellow);
      color: #1a1813;
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #d4ac0d;
      transform: translateY(-2px);
    }

    /* 목록 아이템 표시 */
    .item-list {
      display: grid;
      gap: 12px;
    }

    .recipe-item {
      background-color: var(--input-bg);
      border-left: 4px solid var(--primary-yellow);
      padding: 14px 18px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recipe-title {
      font-weight: 700;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .recipe-materials {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .tag {
      background-color: rgba(241, 196, 15, 0.15);
      color: var(--primary-yellow);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 노크세르 헤더 -->
    <header>
      <h1><i class="fa-solid fa-flask"></i> 노크세르 기숙사 정보소</h1>
      <p>마인크래프트 차카데미 서버 | 노크세르(Knoxer) 전용 연금술 & 마법 레시피</p>
    </header>

    <!-- 연금술/마법 등록 폼 -->
    <div class="card">
      <h2><i class="fa-solid fa-plus-circle"></i> 새로운 레시피 제보하기</h2>
      <form id="recipeForm">
        <div class="form-group">
          <label for="recipeName">결과물 / 마법 이름</label>
          <input type="text" id="recipeName" placeholder="예: 파괴된 마나코어 복구" required />
        </div>

        <div class="form-group">
          <label for="recipeIngredients">들어가는 재료 (3가지)</label>
          <input type="text" id="recipeIngredients" placeholder="예: 파괴된 마나코어, 에메랄드, 네더의 별" required />
        </div>

        <div class="form-group">
          <label for="recipeNote">추가 메모 / 팁</label>
          <textarea id="recipeNote" rows="3" placeholder="연금술 솥 반응이나 주의할 점을 적어주세요."></textarea>
        </div>

        <button type="submit" class="btn-submit">노크세르 DB에 등록하기</button>
      </form>
    </div>

    <!-- 공유된 레시피 목록 -->
    <div class="card">
      <h2><i class="fa-solid fa-book-bookmark"></i> 노크세르 단원 공유 레시피</h2>
      <div id="recipeList" class="item-list">
        <!-- 파이어베이스 데이터가 들어올 영역 -->
        <p style="color: var(--text-sub); text-align: center;">등록된 레시피를 불러오는 중입니다...</p>
      </div>
    </div>
  </div>

  <script>
    // 1. 파이어베이스 설정 (기존 파이어베이스 설정값 유지)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      databaseURL: "https://sanhaegung-dea90-default-rtdb.firebaseio.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // 2. DB 경로를 노크세르(knoxer)로 지정
    const knoxerRecipesRef = database.ref('knoxer/recipes');

    // 3. 레시피 등록 이벤트 핸들러
    document.getElementById('recipeForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('recipeName').value;
      const ingredients = document.getElementById('recipeIngredients').value;
      const note = document.getElementById('recipeNote').value;

      const newRecipeRef = knoxerRecipesRef.push();
      newRecipeRef.set({
        name: name,
        ingredients: ingredients,
        note: note,
        timestamp: Date.now()
      }).then(() => {
        alert('노크세르 레시피가 성공적으로 공유되었습니다!');
        document.getElementById('recipeForm').reset();
      }).catch((err) => {
        console.error("등록 실패:", err);
      });
    });

    // 4. 데이터실시간 조회 및 화면 출력
    knoxerRecipesRef.on('value', (snapshot) => {
      const recipeListElement = document.getElementById('recipeList');
      recipeListElement.innerHTML = '';

      const data = snapshot.val();
      if (!data) {
        recipeListElement.innerHTML = '<p style="color: var(--text-sub); text-align: center;">아직 등록된 노크세르 레시피가 없습니다.</p>';
        return;
      }

      Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const recipeHtml = `
          <div class="recipe-item">
            <div>
              <div class="recipe-title">${item.name}</div>
              <div class="recipe-materials">재료: ${item.ingredients}</div>
              ${item.note ? `<div style="font-size:0.85rem; color:#8e8574; margin-top:3px;">💡 ${item.note}</div>` : ''}
            </div>
            <span class="tag">노크세르</span>
          </div>
        `;
        recipeListElement.innerHTML += recipeHtml;
      });
    });
  </script>
</body>
</html>
