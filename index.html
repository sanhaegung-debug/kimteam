<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차카데미 - 노크세르 기숙사 정보 공유소</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase App & Database Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #1a1813;           /* 딥 다크 노란빛 배경 */
      --card-bg: #26231b;            /* 카카오/웜 브라운 톤 */
      --card-border: #3d3728;
      --primary-yellow: #f1c40f;     /* 노크세르 메인 옐로우 */
      --accent-gold: #e67e22;        /* 스트리머 포인트 골드 */
      --text-main: #f5f0e6;
      --text-sub: #b8af9c;
      --input-bg: #14120e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #2c271d 0%, #1a1813 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(241, 196, 15, 0.08);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-yellow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 카드 세션 스타일 */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.4rem;
      color: var(--primary-yellow);
      margin-bottom: 18px;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 폼 스타일 */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-yellow);
    }

    /* 비밀번호 입력 & 인증 박스 */
    .pw-box {
      display: flex;
      gap: 10px;
    }

    .pw-box input {
      flex: 1;
    }

    .btn-verify {
      padding: 0 16px;
      background-color: #3a3324;
      color: var(--primary-yellow);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .streamer-badge-active {
      display: none;
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      color: #1a1813;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-yellow);
      color: #1a1813;
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #d4ac0d;
      transform: translateY(-2px);
    }

    /* 목록 아이템 표시 */
    .item-list {
      display: grid;
      gap: 12px;
    }

    .recipe-item {
      background-color: var(--input-bg);
      border-left: 4px solid var(--primary-yellow);
      padding: 14px 18px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recipe-item.streamer-post {
      border-left: 4px solid var(--accent-gold);
      background: linear-gradient(90deg, #231e13 0%, var(--input-bg) 100%);
    }

    .recipe-title {
      font-weight: 700;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .recipe-materials {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .tag {
      background-color: rgba(241, 196, 15, 0.15);
      color: var(--primary-yellow);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .tag-streamer {
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      color: #1a1813;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 -->
    <header>
      <h1><i class="fa-solid fa-crown"></i> 노크세르 기숙사 정보소</h1>
      <p>마인크래프트 차카데미 서버 | 노크세르(Knoxer) 전용 공유 공간</p>
    </header>

    <!-- 레시피 등록 폼 -->
    <div class="card">
      <h2><i class="fa-solid fa-plus-circle"></i> 새로운 레시피 제보하기</h2>
      <form id="recipeForm">
        <!-- 스트리머 비밀번호 확인 영역 -->
        <div class="form-group">
          <label for="streamerPw">스트리머 인증 (선택 사항)</label>
          <div class="pw-box">
            <input type="password" id="streamerPw" placeholder="스트리머 비밀번호 입력" />
            <button type="button" class="btn-verify" onclick="checkStreamerPw()">인증 확인</button>
          </div>
          <div id="streamerBadge" class="streamer-badge-active">
            <i class="fa-solid fa-check-circle"></i> 노크세르 스트리머 권한이 인증되었습니다!
          </div>
        </div>

        <div class="form-group">
          <label for="recipeName">결과물 / 마법 이름</label>
          <input type="text" id="recipeName" placeholder="예: 파괴된 마나코어 복구" required />
        </div>

        <div class="form-group">
          <label for="recipeIngredients">들어가는 재료 (3가지)</label>
          <input type="text" id="recipeIngredients" placeholder="예: 파괴된 마나코어, 에메랄드, 네더의 별" required />
        </div>

        <div class="form-group">
          <label for="recipeNote">추가 메모 / 팁</label>
          <textarea id="recipeNote" rows="3" placeholder="연금술 솥 반응이나 주의할 점을 적어주세요."></textarea>
        </div>

        <button type="submit" class="btn-submit">노크세르 DB에 등록하기</button>
      </form>
    </div>

    <!-- 레시피 목록 -->
    <div class="card">
      <h2><i class="fa-solid fa-book-bookmark"></i> 노크세르 단원 공유 레시피</h2>
      <div id="recipeList" class="item-list">
        <p style="color: var(--text-sub); text-align: center;">등록된 레시피를 불러오는 중입니다...</p>
      </div>
    </div>
  </div>

  <script>
    let isStreamer = false;

    // 스트리머 비밀번호 검증 (비밀번호: 223344)
    function checkStreamerPw() {
      const inputPw = document.getElementById('streamerPw').value;
      if (inputPw === "223344") {
        isStreamer = true;
        document.getElementById('streamerBadge').style.display = 'block';
        alert("스트리머 인증에 성공했습니다! [스트리머 전용] 태그로 등록됩니다.");
      } else {
        isStreamer = false;
        document.getElementById('streamerBadge').style.display = 'none';
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    // Firebase 초기화 설정
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      databaseURL: "https://sanhaegung-dea90-default-rtdb.firebaseio.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // 노크세르 전용 DB 경로
    const knoxerRecipesRef = database.ref('knoxer/recipes');

    // Form 제출 처리
    document.getElementById('recipeForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('recipeName').value;
      const ingredients = document.getElementById('recipeIngredients').value;
      const note = document.getElementById('recipeNote').value;

      const newRecipeRef = knoxerRecipesRef.push();
      newRecipeRef.set({
        name: name,
        ingredients: ingredients,
        note: note,
        isStreamer: isStreamer,
        timestamp: Date.now()
      }).then(() => {
        alert('노크세르 레시피가 성공적으로 등록되었습니다!');
        document.getElementById('recipeForm').reset();
        document.getElementById('streamerBadge').style.display = 'none';
        isStreamer = false;
      }).catch((err) => {
        console.error("등록 오류:", err);
      });
    });

    // 실시간 DB 데이터 불러오기
    knoxerRecipesRef.on('value', (snapshot) => {
      const recipeListElement = document.getElementById('recipeList');
      recipeListElement.innerHTML = '';

      const data = snapshot.val();
      if (!data) {
        recipeListElement.innerHTML = '<p style="color: var(--text-sub); text-align: center;">아직 등록된 노크세르 레시피가 없습니다.</p>';
        return;
      }

      Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const streamerClass = item.isStreamer ? 'streamer-post' : '';
        const tagHtml = item.isStreamer 
          ? '<span class="tag-streamer"><i class="fa-solid fa-star"></i> 스트리머</span>' 
          : '<span class="tag">노크세르</span>';

        const recipeHtml = `
          <div class="recipe-item ${streamerClass}">
            <div>
              <div class="recipe-title">${item.name}</div>
              <div class="recipe-materials">재료: ${item.ingredients}</div>
              ${item.note ? `<div style="font-size:0.85rem; color:#a39782; margin-top:3px;">💡 ${item.note}</div>` : ''}
            </div>
            ${tagHtml}
          </div>
        `;
        recipeListElement.innerHTML += recipeHtml;
      });
    });
  </script>
</body>
</html>
